<text x="108" y="320" class="h" font-size="14" text-anchor="start">Repository</text>
<text x="250" y="320" class="s" font-size="11" text-anchor="start">singleton GetInstance</text>
<text x="108" y="342" class="t" font-size="12" text-anchor="start">In-memory lists; SaveData() with System.Text.Json</text>
