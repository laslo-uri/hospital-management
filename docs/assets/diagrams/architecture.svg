<text x="108" y="92" class="h" font-size="14" text-anchor="start">View</text>
<text x="250" y="92" class="s" font-size="11" text-anchor="start">WPF XAML</text>
<text x="108" y="114" class="t" font-size="12" text-anchor="start">MainWindow login  ->  LekarHome / SekretarHome / UpravnikHome / PacijentHome</text>
