<text x="108" y="244" class="h" font-size="14" text-anchor="start">Service</text>
<text x="250" y="244" class="s" font-size="11" text-anchor="start">Servis</text>
<text x="108" y="266" class="t" font-size="12" text-anchor="start">Appointments, drugs, rooms, inventory, anti-spam, reminders</text>
